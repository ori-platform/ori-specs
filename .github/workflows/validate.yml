name: Validate Contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull-request branch supersedes the run in flight: cancel it.
# Pushes to main keep a unique group, so they never cancel or queue behind each
# other; every main commit gets its own complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history: the contract status check reads each complete
          # baseline audit's freeze revision to measure drift from it.
          fetch-depth: 0

      - name: Ensure workflow actions are pinned
        run: |
          refs="$(grep -RhoE 'uses:[[:space:]]+[^[:space:]]+@[^[:space:]]+' .github/workflows || true)"
          bad_refs="$(printf '%s\n' "$refs" | awk -F@ 'NF > 1 && $2 !~ /^[0-9a-f]{40}$/ {print}')"
          if [ -n "$bad_refs" ]; then
            printf 'Mutable GitHub Actions refs are forbidden:\n%s\n' "$bad_refs"
            exit 1
          fi
          # A remote pre-commit hook runs in CI with the job's checkout, so its
          # rev is pinned to a full commit SHA for the same reason.
          bad_revs="$(grep -nE '^[[:space:]]+rev:' .pre-commit-config.yaml | grep -vE 'rev:[[:space:]]+[0-9a-f]{40}([[:space:]]|$)' || true)"
          if [ -n "$bad_revs" ]; then
            printf 'Mutable pre-commit hook revs are forbidden:\n%s\n' "$bad_revs"
            exit 1
          fi

      - name: Install the vector checkers' verifier, hash-locked
        # The evidence, commissioning and capability-grant checkers verify
        # real Ed25519 signatures and need the cryptography package, and the
        # scope decision, the runtime-config and YAML-block checks need PyYAML.
        # Both are installed once from a hash-locked requirement, before the
        # first step that imports either, so no step depends on what the runner
        # image carries.
        run: python3 -m pip install --quiet --require-hashes -r scripts/vector-check-requirements.txt

      # Decide once which checks this change reaches. Each check below is gated
      # on its pre-commit hook's own `files:` pattern, read by scripts/ci-scope,
      # so a check's scope is written in one place. The job still runs and
      # reports, so the required check stays attached to every pull request. A
      # push to main reaches every check, and so does a pull request with no
      # comparable base. scripts/test-ci-scope pins the wiring.
      - name: Decide which checks this change reaches
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ] && [ -n "$PR_BASE_SHA" ]; then
            python3 scripts/ci-scope --base "$PR_BASE_SHA"
          else
            python3 scripts/ci-scope --all
          fi

      - name: Prove the scope decision reaches what it must
        run: python3 scripts/test-ci-scope

      # actions/cache v6.1.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Hygiene (pre-commit)
        # no-commit-to-branch guards a developer's local commits. In CI the
        # checkout is on the branch under test, so on a push to main the hook
        # reports the very state CI exists to validate. Skipped here for the
        # same reason, and by the same mechanism, as the gateway workflow.
        # Every local hook is skipped too: each runs below as its own gated
        # step, so pre-commit here is the whole-tree hygiene hooks, which take
        # seconds, and no check runs twice.
        env:
          SKIP: no-commit-to-branch,${{ steps.scope.outputs.skip }}
        run: |
          python3 -m pip install --quiet pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Check agent skills against their manifest
        if: contains(steps.scope.outputs.reach, ' agent-skills ')
        # agent-skills/ is the review method every engineer's tool installs by
        # digest. Until now a reference edited without regenerating the
        # manifest passed CI and failed closed at every installer instead,
        # which is the wrong place to learn it. An install into a scratch
        # destination verifies the source against the manifest in both
        # directions before it copies anything, and --check reads the copy
        # back; each exits non-zero on any drift.
        run: |
          scripts/install-agent-skills --claude --dest "${RUNNER_TEMP}/agent-skills"
          scripts/install-agent-skills --check --claude --dest "${RUNNER_TEMP}/agent-skills"

      - name: Prove the installer refuses drift
        if: contains(steps.scope.outputs.reach, ' agent-skills ')
        # A checker that passes is evidence only once it has been shown to
        # fire. The installer's own suite mutates throwaway copies of the
        # source and the install -- an edited file, an unmanifested addition,
        # a deletion, a retired skill left behind -- and requires each to be
        # refused.
        run: scripts/test-install-agent-skills

      - name: Check contract status records
        # Explicit as well as a pre-commit hook, for the same reason as the
        # vector gates below: a status gate should not be one SKIP edit away
        # from silently not running. It reads every contract and takes seconds,
        # so it runs on every change.
        run: python3 scripts/check-contract-status

      - name: Prove the contract status checker fires
        if: contains(steps.scope.outputs.reach, ' contract-status-mutations ')
        # The suite introduces each listed fault into a scratch copy and
        # requires a finding for it. That shows the checks it exercises fire;
        # it does not show the rules are complete, or that the recorded
        # history is true, which --verify-siblings checks outside CI.
        run: python3 scripts/check-contract-status --mutations

      - name: Check skills-package vectors
        if: contains(steps.scope.outputs.reach, ' skills-package-vectors ')
        # Each corpus check is its own step rather than part of the hygiene
        # step, so a corpus gate is never one SKIP edit away from silently not
        # running. Its gate is its hook's `files:` pattern; see the scope step.
        run: python3 scripts/check-skills-package-vectors --mutations

      - name: Check safety-profile vectors
        if: contains(steps.scope.outputs.reach, ' safety-profile-vectors ')
        # Explicit for the same reason as the step above.
        run: python3 scripts/check-safety-profile-vectors

      - name: Check runtime-config vectors
        if: contains(steps.scope.outputs.reach, ' runtime-config-vectors ')
        # Explicit for the same reason as the steps above.
        run: python3 scripts/check-runtime-config-vectors

      - name: Check runtime-config-orchestration vectors
        if: contains(steps.scope.outputs.reach, ' runtime-config-orchestration-vectors ')
        # Explicit for the same reason as the steps above.
        run: python3 scripts/check-runtime-config-orchestration-vectors

      - name: Check ed25519-key-admission vectors
        if: contains(steps.scope.outputs.reach, ' ed25519-key-admission-vectors ')
        # Explicit for the same reason as the steps above; the mutations prove
        # each negative vector is refused for its declared reason.
        run: python3 scripts/check-ed25519-key-admission-vectors --mutations

      - name: Reproduce the ed25519-key-admission corpus from its generator
        if: contains(steps.scope.outputs.reach, ' ed25519-key-admission-vectors-reproduce ')
        # The generator shares no code with the checker; a committed corpus it
        # does not reproduce was edited by hand.
        run: python3 scripts/generate-ed25519-key-admission-vectors --check

      - name: Check ed25519-verification vectors
        if: contains(steps.scope.outputs.reach, ' ed25519-verification-vectors ')
        # Explicit for the same reason as the steps above; the mutations prove
        # each refusal is refused for its declared reason.
        run: python3 scripts/check-ed25519-verification-vectors --mutations

      - name: Reproduce the ed25519-verification corpus from its generator
        if: contains(steps.scope.outputs.reach, ' ed25519-verification-vectors-reproduce ')
        # The generator shares no code with the checker; a committed corpus it
        # does not reproduce was edited by hand.
        run: python3 scripts/generate-ed25519-verification-vectors --check

      - name: Check firmware-telemetry/v2 fault vectors
        if: contains(steps.scope.outputs.reach, ' firmware-fault-vectors-v2 ')
        # Explicit for the same reason as the steps above; the mutations prove
        # each refusal is refused for its declared reason and no other.
        run: python3 scripts/check-firmware-fault-vectors-v2 --mutations

      - name: Reproduce the firmware-telemetry/v2 fault corpus from its generator
        if: contains(steps.scope.outputs.reach, ' firmware-fault-vectors-v2-reproduce ')
        # The generator signs with OpenSSL and shares no code with the checker.
        run: python3 scripts/generate-firmware-fault-vectors-v2 --check

      - name: Check firmware-telemetry/v2 manifest vectors
        if: contains(steps.scope.outputs.reach, ' firmware-manifest-vectors-v2 ')
        # Explicit for the same reason as the steps above; the mutations prove
        # each refusal is refused for its declared reason and no other.
        run: python3 scripts/check-firmware-manifest-vectors-v2 --mutations

      - name: Reproduce the firmware-telemetry/v2 manifest corpus from its generator
        if: contains(steps.scope.outputs.reach, ' firmware-manifest-vectors-v2-reproduce ')
        # The generator signs with OpenSSL and shares no code with the checker.
        run: python3 scripts/generate-firmware-manifest-vectors-v2 --check

      - name: Check firmware-telemetry/v2 controller profile vectors
        if: contains(steps.scope.outputs.reach, ' firmware-controller-profile-vectors-v2 ')
        # Grammar and interpretation are read from the contract; the mutations
        # prove each refused document breaks exactly the rule it declares.
        run: python3 scripts/check-firmware-controller-profile-vectors-v2 --mutations

      - name: Reproduce the firmware-telemetry/v2 controller profile corpus from its generator
        if: contains(steps.scope.outputs.reach, ' firmware-controller-profile-vectors-v2-reproduce ')
        # The generator shares no code with the checker.
        run: python3 scripts/generate-firmware-controller-profile-vectors-v2 --check

      - name: Check every fenced YAML block in the Markdown parses
        if: contains(steps.scope.outputs.reach, ' contract-yaml-blocks ')
        # Explicit for the same reason as the steps above. Parsing only: a
        # block's agreement with its contract's tables is each checker's job.
        run: python3 scripts/check-contract-yaml-blocks --mutations

      - name: Check evidence vectors
        if: contains(steps.scope.outputs.reach, ' evidence-vectors ')
        # The core corpus both consumers vendor, and the only one nothing here
        # checked until now: a defect reached a consumer before anything in this
        # repository could refuse it. It verifies real Ed25519 signatures, so it
        # runs after the hash-locked install above rather than before it.
        run: python3 scripts/check-evidence-vectors

      - name: Prove the evidence checker fails on a broken corpus
        if: contains(steps.scope.outputs.reach, ' evidence-vectors-mutations ')
        # A checker that passes is evidence only once it has been shown to fire.
        # This mutates a scratch copy in each way the checker claims to catch and
        # requires a finding naming that fault, so a check reduced to a no-op
        # fails here rather than passing quietly for the life of the repository.
        run: python3 scripts/check-evidence-vectors-mutations

      - name: Check evidence commissioning-resolution vectors
        if: contains(steps.scope.outputs.reach, ' evidence-commissioning-vectors ')
        # Explicit for the same reason as the steps above.
        run: python3 scripts/check-evidence-commissioning-vectors --mutations

      - name: Check evidence commissioning-ingest vectors
        if: contains(steps.scope.outputs.reach, ' evidence-commissioning-ingest-vectors ')
        # Explicit for the same reason as the steps above.
        run: python3 scripts/check-evidence-commissioning-ingest-vectors --mutations

      - name: Check evidence-transport retained-refusal vectors
        if: contains(steps.scope.outputs.reach, ' evidence-transport-retention-vectors ')
        # Explicit for the same reason as the steps above. The retention MAC,
        # the bounds and the coverage rules are read from the contract text.
        run: python3 scripts/check-evidence-transport-retention-vectors --mutations

      - name: Check evidence checkpoint handoff order and stop projections
        if: contains(steps.scope.outputs.reach, ' evidence-handoff-vectors ')
        run: python3 scripts/check-evidence-handoff-vectors --mutations

      - name: Check runtime-evidence-anchor derivations and epoch migration
        if: contains(steps.scope.outputs.reach, ' runtime-evidence-anchor-vectors ')
        run: python3 scripts/check-runtime-evidence-anchor-vectors --mutations

      - name: Check Tier C approval admission, dispatch, restart, offline-tokens/v2 binding and signature domain, and local reconciliation
        if: contains(steps.scope.outputs.reach, ' tier-c-approval-vectors ')
        # Verifies real Ed25519 token signatures, so it runs after the
        # hash-locked install above. Also holds events/v1 and offline-tokens/v1
        # to their published prose, which proves neither wire compatibility nor
        # consumer behavior.
        run: python3 scripts/check-tier-c-approval-vectors --mutations

      - name: Check the evidence no-gating clauses and contradiction patterns
        if: contains(steps.scope.outputs.reach, ' evidence-patf-clauses ')
        # Each named clause is required at its place; a single sentence that
        # pairs a gating verb with Tier C or Tier D outside that list, or that
        # matches a named contradiction pattern, is refused. Rules split across
        # sentences or phrased outside those patterns are not seen.
        run: python3 scripts/check-evidence-patf-clauses --mutations

      - name: Check evidence disposition vectors
        if: contains(steps.scope.outputs.reach, ' evidence-disposition-vectors ')
        # Explicit for the same reason as the steps above. Verifies real Ed25519
        # signatures, and reads the value table, the emission mapping and the
        # runtime rules from the contract text.
        run: python3 scripts/check-evidence-disposition-vectors --mutations

      - name: Check evidence authority key registry vectors
        if: contains(steps.scope.outputs.reach, ' evidence-authority-key-registry-vectors ')
        # Explicit for the same reason as the steps above. Computes the
        # small-order points from the RFC 8032 arithmetic, derives every key_id
        # and refusal from the contract text, and derives each published test
        # key from its seed, so it runs after the hash-locked install above.
        run: python3 scripts/check-evidence-authority-key-registry-vectors --mutations

      - name: Check evidence authority artifact vectors
        if: contains(steps.scope.outputs.reach, ' evidence-authority-artifact-vectors ')
        # Explicit for the same reason as the steps above. Holds each
        # authority-signed artifact file's registry to the registry model above
        # and replays every case by (purpose, key_id) selection, verifying real
        # Ed25519 signatures, so it runs after the hash-locked install above.
        run: python3 scripts/check-evidence-authority-artifact-vectors --mutations

      - name: Check evidence-transport refusal-policy vectors
        if: contains(steps.scope.outputs.reach, ' evidence-transport-refusal-policy-vectors ')
        # Explicit for the same reason as the steps above. The policy is read
        # from the contract text, and the mutation run proves the check refuses
        # a corrupted corpus.
        run: python3 scripts/check-evidence-transport-refusal-policy-vectors --mutations

      - name: Check gateway site-health evidence projection vectors
        if: contains(steps.scope.outputs.reach, ' gateway-site-health-evidence-vectors ')
        # Explicit for the same reason as the steps above. Reads the reasons a
        # status admits from the evidence-transport policy, so the two contracts
        # cannot disagree.
        run: python3 scripts/check-gateway-site-health-evidence-vectors --mutations

      - name: Check evidence-exchange routing projection vectors
        if: contains(steps.scope.outputs.reach, ' evidence-routing-projection-vectors ')
        # Explicit for the same reason as the steps above.
        run: python3 scripts/check-evidence-routing-projection-vectors --mutations

      - name: Check gateway return path per device and declared inbound carriage
        if: contains(steps.scope.outputs.reach, ' gateway-return-path-vectors ')
        # Explicit for the same reason as the steps above. A mixed site, where a
        # legacy device never acknowledges, must not stall another device.
        run: python3 scripts/check-gateway-return-path-vectors --mutations

      - name: Check evidence-transport response generation by carriage capability
        if: contains(steps.scope.outputs.reach, ' evidence-transport-capability-vectors ')
        # Explicit for the same reason as the steps above. A legacy ingest
        # credential receives no response member or status its gateway refuses.
        run: python3 scripts/check-evidence-transport-capability-vectors --mutations

      - name: Check gateway-config evidence vectors
        if: contains(steps.scope.outputs.reach, ' gateway-config-evidence-vectors ')
        # Explicit for the same reason as the steps above.
        run: python3 scripts/check-gateway-config-evidence-vectors --mutations

      - name: Check commissioned-safety-binding vectors
        if: contains(steps.scope.outputs.reach, ' commissioned-binding-vectors ')
        # Explicit for the same reason as the steps above. This corpus was
        # checked only inside a consumer repository until now, so an edit here
        # travelled outward as a contract change nobody wrote.
        run: python3 scripts/check-commissioned-binding-vectors

      - name: Prove the commissioned-safety-binding checker fires
        if: contains(steps.scope.outputs.reach, ' commissioned-binding-vectors-mutations ')
        # The misreading check passes by measuring nothing if its table is
        # emptied or it is no longer called, so it is shown to fire.
        run: python3 scripts/check-commissioned-binding-vectors-mutations

      - name: Check safety-qualification-fixture vectors
        if: contains(steps.scope.outputs.reach, ' safety-qualification-fixture-vectors ')
        # Explicit for the same reason as the steps above. This corpus asserts
        # its own coverage boundary — deferred fixture cases are not coverage —
        # so a silently skipped gate here would let that boundary rot.
        run: python3 scripts/check-safety-qualification-fixture-vectors

      - name: Check capability-grant vectors
        if: contains(steps.scope.outputs.reach, ' capability-grant-vectors ')
        # Explicit for the same reason as the steps above. No consumer
        # implements this contract yet, so this checker is the corpus's only
        # executable reader until the runtime verifier lands.
        run: python3 scripts/check-capability-grant-vectors

      - name: Check capability-grant-issuance vectors
        if: contains(steps.scope.outputs.reach, ' capability-grant-issuance-vectors ')
        # Explicit for the same reason as the steps above. Denial is digest
        # matching, so this checker needs no key material, but it recomputes
        # its targets from the capability-grant corpus, so it runs beside it.
        run: python3 scripts/check-capability-grant-issuance-vectors

      - name: Check runtime-mobile payload publication vectors
        if: contains(steps.scope.outputs.reach, ' runtime-mobile-payload-vectors ')
        # Explicit for the same reason as the steps above. No consumer
        # implements runtime-mobile/v2 yet, so this checker is the corpus's only
        # executable reader, and it verifies real Ed25519 signatures.
        run: python3 scripts/check-runtime-mobile-payload-vectors

      - name: Prove the payload publication checker fails on a broken corpus
        if: contains(steps.scope.outputs.reach, ' runtime-mobile-payload-vectors-mutations ')
        # A checker that passes is evidence only once it has been shown to fire,
        # and the faults that matter here look healthy from outside: a neutered
        # refusal, a refusal made impure, a stage left with no case.
        run: python3 scripts/check-runtime-mobile-payload-vectors-mutations

      - name: Check required files exist
        run: |
          for f in \
            README.md VERSIONING.md CONTRIBUTING.md SECURITY.md LICENSE \
            events/v1.md gateway-api/v1.md gateway-evidence-carriage/v1.md skills-package/v1.md cli-commands/v1.md \
            tier-c-approval/v1.md \
            signing/v1.md scripts/check-contract-status \
            gaps/open.md gaps/resolved.md .github/CODEOWNERS .github/workflows/validate.yml; do
            test -f "$f" || (echo "Missing: $f" && exit 1)
          done

      - name: Ensure repo remains docs-only
        run: |
          if find . -type f \( -name '*.py' -o -name '*.go' -o -name '*.rs' -o -name '*.js' -o -name '*.ts' \) | grep -v '^./.git/'; then
            echo "Code files detected in docs-only repo"
            exit 1
          fi

      - name: Validate markdown links
        # gaurav-nelson/github-action-markdown-link-check v1
        uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368
        with:
          use-quiet-mode: yes
          check-modified-files-only: no
