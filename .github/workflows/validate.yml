name: Validate Contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Ensure workflow actions are pinned
        run: |
          refs="$(grep -RhoE 'uses:[[:space:]]+[^[:space:]]+@[^[:space:]]+' .github/workflows || true)"
          bad_refs="$(printf '%s\n' "$refs" | awk -F@ 'NF > 1 && $2 !~ /^[0-9a-f]{40}$/ {print}')"
          if [ -n "$bad_refs" ]; then
            printf 'Mutable GitHub Actions refs are forbidden:\n%s\n' "$bad_refs"
            exit 1
          fi

      - name: Hygiene (pre-commit)
        # no-commit-to-branch guards a developer's local commits. In CI the
        # checkout is on the branch under test, so on a push to main the hook
        # reports the very state CI exists to validate. Skipped here for the
        # same reason, and by the same mechanism, as the gateway workflow.
        env:
          SKIP: no-commit-to-branch
        run: |
          python3 -m pip install --quiet pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Check required files exist
        run: |
          for f in \
            README.md VERSIONING.md CONTRIBUTING.md SECURITY.md LICENSE \
            events/v1.md gateway-api/v1.md skills-package/v1.md cli-commands/v1.md \
            signing/v1.md \
            gaps/open.md gaps/resolved.md .github/CODEOWNERS .github/workflows/validate.yml; do
            test -f "$f" || (echo "Missing: $f" && exit 1)
          done

      - name: Ensure repo remains docs-only
        run: |
          if find . -type f \( -name '*.py' -o -name '*.go' -o -name '*.rs' -o -name '*.js' -o -name '*.ts' \) | grep -v '^./.git/'; then
            echo "Code files detected in docs-only repo"
            exit 1
          fi

      - name: Validate markdown links
        # gaurav-nelson/github-action-markdown-link-check v1
        uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368
        with:
          use-quiet-mode: yes
          check-modified-files-only: no
