# Every commit a pull request carries must be signed and verified by GitHub.
# Branch protection holds that rule at merge time; this reports it as a named
# check on every push, lists each offending commit, and fails closed when the
# commit list cannot be read in full.
name: Signed commits

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  signed:
    name: Signed commits
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Test the check
        run: python3 scripts/test-check-signed-commits

      - name: Check every commit's signature
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-signed-commits --repo "$REPO" --pr "$PR_NUMBER" --head-sha "$HEAD_SHA"
