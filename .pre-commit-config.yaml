# Hygiene for a docs-only repository.
#
# The vector files here are normative: consumers vendor their bytes verbatim
# under a digest manifest. A consumer that runs an end-of-file hook against a
# vendored copy lacking a terminator must either rewrite it, which breaks the
# digest and forks the contract, or exempt the file from hygiene. Enforcing the
# terminator at the source removes that choice.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, main]

  # A commit subject and a pull request title are the same artifact: GitHub's
  # squash merge uses the title whenever a pull request carries more than one
  # commit. This repository had neither gate, and `096b81e` on main is the
  # result. The hook covers the commit; the workflow covers the title.
  - repo: local
    hooks:
      - id: conventional-subject
        name: Conventional commit format
        language: system
        stages: [commit-msg]
        entry: scripts/check-conventional-subject --commit-msg-file
        pass_filenames: true

  # The vector corpus makes two claims about itself that a human check kept
  # getting wrong: that it covers every case the descriptor core requires, and
  # that no vector can be refused for a reason other than the one it names.
  # Both are now checked here, so CI's `pre-commit run --all-files` runs them.
  - repo: local
    hooks:
      - id: skills-package-vectors
        name: skills-package vector coverage and isolation
        entry: scripts/check-skills-package-vectors
        language: system
        pass_filenames: false
        files: ^(skills-package/vectors/|schema-descriptor/v1\.md|scripts/check-skills-package-vectors)

  # The evidence corpus is what both consumers vendor and verify against, and
  # until now nothing in this repository checked it: a defect reached a consumer
  # before anything here could refuse it. The checker restates the derivations
  # from the contract and evaluates every rejection case for its own declared
  # rule, so a case that rejects by accident fails rather than passes.
  - repo: local
    hooks:
      - id: evidence-vectors
        name: evidence corpus derivation, signature and rejection agreement
        entry: scripts/check-evidence-vectors
        language: python
        additional_dependencies: ["cryptography==50.0.1"]
        pass_filenames: false
        files: ^(evidence/|scripts/check-evidence-vectors)

      - id: evidence-vectors-mutations
        name: evidence checker fires on a broken corpus
        entry: scripts/check-evidence-vectors-mutations
        language: python
        additional_dependencies: ["cryptography==50.0.1"]
        pass_filenames: false
        files: ^(evidence/|scripts/check-evidence-vectors)

  # The safety-profile corpus is hand-authored, so a literal in it can
  # contradict the rule it illustrates. The checker recomputes every
  # expectation from the contract and refuses the corpus on disagreement.
  - repo: local
    hooks:
      - id: safety-profile-vectors
        name: safety-profile vector agreement and coverage
        entry: scripts/check-safety-profile-vectors
        language: system
        pass_filenames: false
        files: ^(safety-profile/|scripts/check-safety-profile-vectors)

  # The runtime-config/v2 schema and corpus are hand-authored, and the field
  # appendix in v2.md is generated from the schema. The checker holds all three
  # to the contract and refuses drift between the schema and the prose.
  - repo: local
    hooks:
      - id: runtime-config-vectors
        name: runtime-config schema, corpus and appendix agreement
        entry: scripts/check-runtime-config-vectors
        language: python
        additional_dependencies: ["PyYAML==6.0.3"]
        pass_filenames: false
        files: ^(runtime-config/v2\.md|runtime-config/vectors/|scripts/check-runtime-config-vectors)

  # The orchestration corpus is hand-authored state transitions; the checker
  # recomputes every verdict and state from the contract's composition rules.
  - repo: local
    hooks:
      - id: runtime-config-orchestration-vectors
        name: runtime-config-orchestration transition agreement and coverage
        entry: scripts/check-runtime-config-orchestration-vectors
        language: system
        pass_filenames: false
        files: ^(runtime-config-orchestration/|scripts/check-runtime-config-orchestration-vectors)

  # The commissioning-resolution corpus carries real Ed25519 signatures over
  # the published test seeds, so the checker verifies them rather than trusting
  # the file; it needs the cryptography package and runs in its own environment.
  - repo: local
    hooks:
      - id: evidence-commissioning-vectors
        name: evidence commissioning-resolution corpus agreement and coverage
        entry: scripts/check-evidence-commissioning-vectors --mutations
        language: python
        additional_dependencies: ["cryptography==50.0.1"]
        pass_filenames: false
        files: ^(evidence-exchange/|evidence-commissioning-ingest/|evidence-transport/|scripts/check-evidence-commissioning-vectors|scripts/check-evidence-transport-refusal-policy-vectors|scripts/evidence-.*pinned-units.json)
      - id: evidence-commissioning-ingest-vectors
        name: evidence commissioning-ingest authentication, cancellation and refusal coverage, with mutations
        entry: scripts/check-evidence-commissioning-ingest-vectors --mutations
        language: python
        additional_dependencies: ["cryptography==50.0.1"]
        pass_filenames: false
        files: ^(evidence-commissioning-ingest/|evidence-exchange/vectors/commissioning-authorization.json|scripts/check-evidence-commissioning-ingest-vectors)
      - id: evidence-transport-retention-vectors
        name: evidence-transport retained refusals and retention bounds, with mutations
        entry: scripts/check-evidence-transport-retention-vectors --mutations
        language: python
        pass_filenames: false
        files: ^(evidence-transport/|evidence-exchange/v2.md|scripts/check-evidence-transport-retention-vectors|scripts/evidence-transport-retention-pinned-units.json)
      - id: evidence-handoff-vectors
        name: evidence checkpoint handoff order and stop projections, with mutations
        entry: scripts/check-evidence-handoff-vectors --mutations
        language: python
        pass_filenames: false
        files: ^(evidence-transport/|evidence-exchange/v2.md|scripts/check-evidence-handoff-vectors)
      - id: runtime-evidence-anchor-vectors
        name: runtime-evidence-anchor derivations and epoch migration, with mutations
        entry: scripts/check-runtime-evidence-anchor-vectors --mutations
        language: python
        pass_filenames: false
        files: ^(runtime-evidence-anchor/|evidence-exchange/v2.md|scripts/check-runtime-evidence-anchor-vectors)
      - id: tier-c-approval-vectors
        name: Tier C approval admission, dispatch, restart, offline-tokens/v2 binding and signature domain, and local reconciliation, with mutations
        entry: scripts/check-tier-c-approval-vectors --mutations
        language: python
        additional_dependencies: ["cryptography==50.0.1"]
        pass_filenames: false
        files: ^(tier-c-approval/|gateway-api/|gateway-evidence-carriage/|events/|offline-tokens/|cli-commands/|operator-socket/|evidence/vectors/chain-row-v3.json|runtime-config/v1.md|runtime-config/v2.md|runtime-config/vectors/schema.json|runtime-health/v3.md|skills-package/v2.md|safety-profile/vectors/legacy-actions.json|signing/v2.md|scripts/check-tier-c-approval-vectors)
      - id: evidence-patf-clauses
        name: evidence no-gating clauses, single-sentence gating scan and named contradiction patterns, with mutations
        entry: scripts/check-evidence-patf-clauses --mutations
        language: python
        pass_filenames: false
        files: ^(evidence-transport/v2.md|evidence-exchange/v2.md|evidence-commissioning-ingest/v1.md|gateway-api/v1.md|gateway-api/v2.md|gateway-evidence-carriage/v1.md|tier-c-approval/v1.md|runtime-health/v3.md|device-provisioning/v1.md|operator-socket/v1.md|events/|offline-tokens/|runtime-config/v2.md|scripts/check-evidence-patf-clauses)
      - id: evidence-disposition-vectors
        name: evidence-exchange disposition artifacts, mapping and runtime effects, with mutations
        entry: scripts/check-evidence-disposition-vectors --mutations
        language: python
        additional_dependencies: ["cryptography==50.0.1"]
        pass_filenames: false
        files: ^(evidence-exchange/|runtime-health/v3.md|scripts/check-evidence-disposition-vectors|scripts/evidence-exchange-disposition-pinned-units.json)
      - id: evidence-transport-refusal-policy-vectors
        name: evidence-transport refusal policy derived from the contract text, with mutations
        entry: scripts/check-evidence-transport-refusal-policy-vectors --mutations
        language: python
        pass_filenames: false
        files: ^(evidence-transport/|scripts/check-evidence-transport-refusal-policy-vectors|scripts/evidence-transport-pinned-units.json)
      - id: evidence-routing-projection-vectors
        name: evidence-exchange routing projection stable across versions, with mutations
        entry: scripts/check-evidence-routing-projection-vectors --mutations
        language: python
        pass_filenames: false
        files: ^(evidence-exchange/v2.md|evidence-exchange/vectors/routing-projection-v2.json|scripts/check-evidence-routing-projection-vectors|scripts/evidence-exchange-routing-pinned-units.json)
      - id: gateway-return-path-vectors
        name: gateway return path per device and declared inbound carriage, with mutations
        entry: scripts/check-gateway-return-path-vectors --mutations
        language: python
        pass_filenames: false
        files: ^(gateway-evidence-carriage/|gateway-api/v1.md|gateway-config/v2.md|scripts/check-gateway-return-path-vectors)
      - id: evidence-transport-capability-vectors
        name: evidence-transport response generation by registered carriage capability, with mutations
        entry: scripts/check-evidence-transport-capability-vectors --mutations
        language: python
        pass_filenames: false
        files: ^(evidence-transport/|scripts/check-evidence-transport-capability-vectors)
      - id: gateway-config-evidence-vectors
        name: gateway-config evidence defaults and load rules, with mutations
        entry: scripts/check-gateway-config-evidence-vectors --mutations
        language: python
        pass_filenames: false
        files: ^(gateway-config/|scripts/check-gateway-config-evidence-vectors)
      - id: gateway-site-health-evidence-vectors
        name: gateway site-health evidence projection, per device and lane, with mutations
        entry: scripts/check-gateway-site-health-evidence-vectors --mutations
        language: python
        pass_filenames: false
        files: ^(gateway-evidence-carriage/|gateway-api/v1.md|evidence-transport/v2.md|scripts/check-gateway-site-health-evidence-vectors|scripts/check-evidence-transport-refusal-policy-vectors|scripts/.*pinned-units.json)
      # A fenced YAML example in a contract is copied as the contract, and the
      # check-yaml hook above never sees one inside Markdown.
      - id: contract-yaml-blocks
        name: every fenced YAML block in the Markdown parses, with mutations
        entry: scripts/check-contract-yaml-blocks --mutations
        language: python
        additional_dependencies: ["PyYAML==6.0.3"]
        pass_filenames: false
        files: (\.md$|^scripts/check-contract-yaml-blocks$)
      # The qualification-fixture corpus carries a claim no other corpus makes:
      # its fixture cases are deferred, not exercised, because stage 0 refuses
      # every fixture before the stage each case declares. The checker derives
      # that rule from the contract, so neither state can be left behind when
      # the ceilings land.
      - id: safety-qualification-fixture-vectors
        name: safety-qualification-fixture byte, signature and deferral agreement
        entry: scripts/check-safety-qualification-fixture-vectors
        language: python
        additional_dependencies: ["cryptography==50.0.1"]
        pass_filenames: false
        files: ^(safety-qualification-fixture/|scripts/check-safety-qualification-fixture-vectors)

      - id: commissioned-binding-vectors
        name: commissioned-safety-binding byte, signature and coverage agreement
        entry: scripts/check-commissioned-binding-vectors
        language: python
        additional_dependencies: ["cryptography==50.0.1"]
        pass_filenames: false
        files: ^(commissioned-safety-binding/|scripts/check-commissioned-binding-vectors)

  # Every contract version's status lives in one record under status/, and the
  # Status: paragraphs, README rows and VERSIONING rows are summaries of it. The
  # checker refuses a summary that disagrees, a record that breaks the freeze
  # rule, and an unclassified edit to a frozen version's text; the mutations
  # prove each of those refusals fires.
  - repo: local
    hooks:
      - id: contract-status
        name: contract status records, summaries and frozen text
        entry: scripts/check-contract-status
        language: system
        pass_filenames: false
        files: ^(status/|[a-z0-9-]+/v[0-9]+\.md$|README\.md$|VERSIONING\.md$|scripts/check-contract-status$)
      - id: contract-status-mutations
        name: contract status checker fires on each fault it names
        entry: scripts/check-contract-status --mutations
        language: system
        pass_filenames: false
        files: ^(status/|[a-z0-9-]+/v[0-9]+\.md$|README\.md$|VERSIONING\.md$|scripts/check-contract-status$)
